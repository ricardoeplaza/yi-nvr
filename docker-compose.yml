services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
      - "21:21"
      - "1024-1027:1024-1027"
    volumes:
      - ./data:/app/data
      - ./incoming:/app/incoming
      - ./recordings:/app/recordings
      - ./infra/cameras.json:/app/infra/cameras.json
      # Backup 3-2-1 (opcional): mapear el mountpoint remoto del host (NFS o
      # rclone) sobre el directorio fijo /app/remote_recordings. Ejemplo:
      #   - /srv/nvr/remote_recordings:/app/remote_recordings
      #     + REMOTE_MIRROR=1 en .env
      # Staging rápido (opcional, alternativa al bind de ./incoming): tmpfs/ramdisk
      #   - type: tmpfs
      #     target: /app/incoming
      #     size: 512m
    environment:
      - DATA_DIR=/app/data
      - INCOMING_DIR=/app/incoming
      - RECORDINGS_DIR=/app/recordings
      - REMOTE_RECORDINGS_DIR=/app/remote_recordings
      - REMOTE_MIRROR=${REMOTE_MIRROR:-}
      - CAMERAS_JSON_PATH=/app/infra/cameras.json
      - FTP_PASSIVE_RANGE=1024-1027
      - FFMPEG_CONCURRENCY=${FFMPEG_CONCURRENCY:-1}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - PREVIEW_SECONDS=${PREVIEW_SECONDS:-4}
      - PREVIEW_FPS=${PREVIEW_FPS:-6}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - GO2RTC_URL=http://${NVR_PUBLIC_IP}:1984
      - NVR_PUBLIC_IP=${NVR_PUBLIC_IP}
      - FTP_USER=${FTP_USER:-camera}
      - FTP_PASS=${FTP_PASS:-surveillance123}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_CONTACT_EMAIL=${VAPID_CONTACT_EMAIL}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - STORAGE_MAX_GB=${STORAGE_MAX_GB:-10}
    depends_on: [mosquitto, go2rtc]
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
  go2rtc:
    image: alexxit/go2rtc:latest
    network_mode: host
    volumes:
      - ./infra/go2rtc:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        while [ ! -f /config/go2rtc.yaml ]; do sleep 0.5; done
        exec go2rtc -config /config/go2rtc.yaml
    restart: unless-stopped
