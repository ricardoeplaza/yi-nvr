<div class="sheet-backdrop" [class.show]="open()" (click)="close.emit()"></div>
<div class="sheet" [class.show]="open()">
  <div class="sheet-handle"></div>
  <h2>{{ 'gallery.retention.title' | t }}</h2>
  <p class="desc">{{ 'storage.sheet.description' | t }}</p>
  <div class="segmented" role="group" [attr.aria-label]="'storage.scopeLabel' | t">
    <button type="button" [class.is-selected]="scope() === 'day'" (click)="scopeChange.emit('day')">{{ 'storage.sheet.option.day' | t }}</button>
    <button type="button" [class.is-selected]="scope() === 'week'" (click)="scopeChange.emit('week')">{{ 'storage.sheet.option.week' | t }}</button>
    <button type="button" [class.is-selected]="scope() === 'month'" (click)="scopeChange.emit('month')">{{ 'storage.sheet.option.month' | t }}</button>
    <button type="button" [class.is-selected]="scope() === 'all'" (click)="scopeChange.emit('all')">{{ 'storage.sheet.option.all' | t }}</button>
  </div>
  <div class="purge-preview">
    <span>{{ 'storage.sheet.previewLabel' | t }}</span>
    <b>{{ expected() ?? '…' }}</b>
  </div>
  <div class="sheet-row">
    <span class="label">{{ 'storage.sheet.spaceUsed' | t }}</span>
    <span class="value">{{ usedLabel() }}</span>
  </div>
  <div class="sheet-row">
    <span class="label">{{ 'storage.sheet.savedClips' | t }}</span>
    <span class="value">{{ storageCount() ?? '…' }}</span>
  </div>
  <button class="purge-btn" [disabled]="purging() || (expected() ?? 0) <= 0" (click)="purge.emit()">
    {{ (purging() ? 'storage.deleting' : 'storage.sheet.purgeNow') | t }}
  </button>
</div>
