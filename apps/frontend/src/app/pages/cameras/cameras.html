<div class="cameras-page">
  <yi-app-header [title]="'cameras.title' | t">
    @if (cameras().length) {
      <p class="cameras-subtitle">
        {{ 'cameras.subtitle' | t: { count: cameras().length, s: cameras().length !== 1 ? 's' : '' } }}
      </p>
    }
  </yi-app-header>

  <main class="cameras">
    @if (loading()) {
      <div class="loading">{{ 'common.loading' | t }}</div>
    } @else if (cameras().length) {
      <div class="camera-grid">
        @for (cam of cameras(); track cam.id) {
          <yi-camera-card
            [camera]="cam"
            [status]="cam.status ?? null"
            [powerOn]="powerService.isOn(cam.id)"
            [thumbnailUrl]="cam.latest_video?.thumbnail_url ?? null"
            [lastEventAt]="lastClipAt(cam)"
            (togglePower)="onTogglePower($event)"
            (toggleRecMode)="onToggleRecMode($event)"
          />
        }
      </div>
    } @else {
      <yi-empty-state icon="📷" [title]="'cameras.empty.title' | t" [subtitle]="'cameras.empty.subtitle' | t" />
    }
  </main>
</div>
