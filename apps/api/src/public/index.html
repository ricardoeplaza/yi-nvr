<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yi-nvr</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Cabecera -->
        <header class="header">
            <h1>yi-nvr</h1>
            <p class="subtitle">Panel de control de vigilancia</p>
        </header>

        <!-- Panel de filtros -->
        <section class="filters">
            <div class="filter-group">
                <label for="camera-select">Cámara:</label>
                <select id="camera-select">
                    <option value="">Todas las cámaras</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="date-start">Desde:</label>
                <input type="date" id="date-start">
            </div>
            
            <div class="filter-group">
                <label for="date-end">Hasta:</label>
                <input type="date" id="date-end">
            </div>
            
            <button id="btn-refresh" class="btn-primary">Actualizar</button>
            <button id="btn-clear" class="btn-secondary">Limpiar</button>
        </section>

        <!-- Tabs de navegación -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="gallery">Galería</button>
            <button class="tab-btn" data-tab="timeline">Timeline</button>
        </nav>

        <!-- Vista: Galería de videos -->
        <section id="gallery-view" class="tab-content active">
            <div id="videos-grid" class="videos-grid">
                <div class="loading">Cargando videos...</div>
            </div>
            <div id="pagination-controls" class="pagination-controls">
                <button id="prev-page" class="btn-pagination" disabled>&lt; Anterior</button>
                <span id="page-info" class="page-info">Página 1 de 1</span>
                <button id="next-page" class="btn-pagination" disabled>Siguiente &gt;</button>
            </div>
        </section>

        <!-- Vista: Timeline -->
        <section id="timeline-view" class="tab-content">
            <div id="timeline-container" class="timeline-container">
                <div class="loading">Cargando timeline...</div>
            </div>
        </section>

        <!-- Modal para reproducción de video -->
        <div id="video-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modal-title">Video</h2>
                <video id="modal-video" controls>
                    <p>Tu navegador no soporta video HTML5.</p>
                </video>
                <div class="modal-info">
                    <p><strong>Cámara:</strong> <span id="modal-camera"></span></p>
                    <p><strong>Fecha:</strong> <span id="modal-date"></span></p>
                    <p><strong>Duración:</strong> <span id="modal-duration"></span></p>
                    <p><strong>Tamaño:</strong> <span id="modal-size"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
