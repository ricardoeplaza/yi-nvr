# Mosquitto 2 — broker MQTT interno de yi-nvr
#
# Solo accesible desde la red interna de Docker (red del compose).
# NO se publica el puerto 1883 al host (ver docker-compose.yml): el único
# cliente MQTT del sistema es el API. En el SBC, si las cámaras (yi-hack)
# necesitan hablar con el broker desde la LAN, se añade entonces un listener
# adicional en la interfaz LAN.

listener 1883
protocol mqtt

# Sin usuarios: se permite el acceso anónimo (red doméstica cerrada detrás
# de Tailscale/Headscale; el broker no se expone a internet).
# OJO: Mosquitto 2 deniega el anónimo por defecto → hay que habilitarlo.
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
